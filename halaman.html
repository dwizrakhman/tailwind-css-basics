<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Responsif Lengkap</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-white font-[Arial,sans-serif] text-black">

    <header class="flex flex-col items-center justify-between gap-4 bg-[#2c3e50] p-5 text-white md:flex-row">
        <h1 class="text-[32px] font-bold">Website Saya</h1>

        <nav>
            <ul class="flex list-none gap-5">
                <li><a href="#" class="hover:underline">Beranda</a></li>
                <li><a href="#" class="hover:underline">Tentang</a></li>
                <li><a href="#" class="hover:underline">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main class="mx-auto flex w-[94%] flex-col gap-5 p-5 md:flex-row">

        <section class="min-w-0 rounded-lg bg-[#ecf0f1] p-5 md:flex-[2]">
            <h2 class="mb-1 text-2xl font-bold">Artikel Utama</h2>
            <p>
                Ini adalah konten utama halaman. Teks ini akan menyesuaikan lebar layar.
            </p>
        </section>

        <aside class="min-w-0 rounded-lg bg-[#bdc3c7] p-5 md:flex-1">
            <h3 class="mb-1 text-lg font-bold">Sidebar</h3>
            <p>Informasi tambahan.</p>
        </aside>

    </main>

    <footer class="bg-[#2c3e50] p-4 text-center text-white">
        <p>&copy; 2026 Website Saya</p>
    </footer>

</body>
</html>
